name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          cache: true


      - name: Install SDL2 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsdl2-dev \
            libgl1-mesa-dev \
            libxkbcommon-x11-0

      - name: Install SDL2 (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2

      - name: Install SDL2 (Windows, vcpkg)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          vcpkg install sdl2:x64-windows
      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Smoke test (Linux, headless)
        if: runner.os == 'Linux'
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen timeout 15s ./build/base_window
          code=$?
          set -e
          if [ "$code" -eq 124 ] || [ "$code" -eq 0 ]; then
            echo "OK: application started and ran without crashing"
          else
            echo "FAILED: application exited with code $code"
            exit 1
          fi

      - name: Smoke test (Windows, headless)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $exe = Join-Path $PWD 'build/Release/base_window.exe'
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) {
            Write-Error "Application exited early with code $($p.ExitCode)"
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "OK: application started and ran without crashing"

      - name: Smoke test (macOS, headless)
        if: runner.os == 'macOS'
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen ./build/base_window &
          pid=$!
          sleep 10
          if ! kill -0 $pid 2>/dev/null; then
            wait $pid
            echo "FAILED: application exited early with code $?"
            exit 1
          fi
          kill $pid 2>/dev/null || true
          wait $pid 2>/dev/null || true
          echo "OK: application started and ran without crashing"
